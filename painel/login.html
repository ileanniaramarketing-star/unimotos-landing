<body>
  <main class="painel-login">
    <form class="painel-login__card" id="loginForm" novalidate autocomplete="off">
      <img class="painel-login__logo" src="/assets/brand/logo-dark.png?v=bdf3dc6e" alt="Unimotos" width="252" height="72" decoding="async">
      <h1 id="loginTitle">Painel interno</h1>
      <p class="sub" id="loginSub">Entre com seu e-mail e senha.</p>

      <div class="painel-field">
        <label for="loginUser">E-mail</label>
        <input id="loginUser" name="user" type="email" autocomplete="username" required>
      </div>
      <div class="painel-field">
        <label for="loginPass">Senha</label>
        <input id="loginPass" name="pass" type="password" autocomplete="current-password" required minlength="6">
      </div>

      <button class="painel-btn" id="loginBtn" type="submit">Entrar</button>
      <p class="painel-msg painel-msg--erro" id="loginMsg" hidden></p>
      <button class="painel-link" id="toggleModeBtn" type="button">Ainda não tem conta? Cadastre-se</button>
    </form>
  </main>

  <script src="/painel/painel.js?v=a0ba3de7" defer></script>
